<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — SGV</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
</head>
<body>

  <nav class="navbar navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="index.html">SGV</a>
    </div>
  </nav>

  <main class="py-5">
    <div class="container">
      <div class="auth-card">
        <div class="text-center mb-4">
          <h1 class="h3 fw-bold">Entrar no SGV</h1>
          <p class="text-muted">Acesse o painel da sua empresa.</p>
        </div>

        <div id="alert-container"></div>

        <div class="card shadow-sm border-0">
          <div class="card-body p-4">
            <form id="form-login">
              <div class="mb-3">
                <label for="email" class="form-label">E-mail</label>
                <input type="email" class="form-control" id="email" required>
              </div>
              <div class="mb-4">
                <label for="senha" class="form-label">Senha</label>
                <input type="password" class="form-control" id="senha" required>
              </div>
              <button type="submit" class="btn btn-dark w-100">Entrar</button>
            </form>
          </div>
        </div>

        <div class="alert alert-light border mt-3 mb-0 small">
          <strong>Conta demo:</strong> demo@sgv.com / demo123
        </div>

        <p class="text-center mt-3 mb-0">
          Não tem conta? <a href="sign-in.html">Cadastre-se</a>
        </p>
      </div>
    </div>
  </main>

  <footer class="py-3 mt-auto">
    <div class="container"><span class="footer-logo text-white">SGV</span></div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/login.js"></script>
</body>
</html>
